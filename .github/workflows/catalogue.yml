name: Annuaire

# Mise à jour automatique de l'annuaire, sans relecture. Rien n'est publié si une source échoue
# ou si une liste perd plus de 15 % de ses entrées : le job échoue et la liste en ligne reste intacte.
# Quotidien : répertoires et registres. Dimanche : en plus, la recherche GitHub longue.
on:
  schedule:
    - cron: '23 5 * * *'
    - cron: '17 1 * * 0'
  workflow_dispatch:
    inputs:
      forcer:
        description: 'Publier malgré une chute de plus de 15 %'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: annuaire
  cancel-in-progress: false

jobs:
  collecter:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # Sans le secret ANNUAIRE_GH_TOKEN, toutes les étapes sont ignorées : le job reste vert et ne fait rien.
    env:
      JETON: ${{ secrets.ANNUAIRE_GH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.JETON != ''
      - uses: actions/setup-node@v4
        if: env.JETON != ''
        with:
          node-version: 22
      - name: Reprendre l'état du passage précédent
        if: env.JETON != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/raw
          gh release download annuaire-etat --pattern etat.json --dir data/raw --clobber || echo "Pas d'état : premier passage."
      - name: Collecter
        if: env.JETON != ''
        env:
          GITHUB_TOKEN: ${{ secrets.ANNUAIRE_GH_TOKEN }}
          ANNUAIRE_FORCER: ${{ inputs.forcer && '1' || '' }}
          # Le dimanche seulement, la recherche de fichiers (longue) : 30 + 30 + 120 minutes.
          ANNUAIRE_BUDGETS: ${{ github.event.schedule == '17 1 * * 0' && '{"marketplaces":30,"pluginsJson":30,"skills":120,"npm":15}' || '{"marketplaces":0,"pluginsJson":0,"skills":0,"npm":15}' }}
        run: node scripts/annuaire-collecter.mjs
      - name: Publier
        if: env.JETON != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/annuaire
          if git diff --cached --quiet; then echo "Rien de nouveau."; exit 0; fi
          git commit -m "chore(annuaire): met à jour la liste du $(date +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Relancer la mise en ligne du site
        if: env.JETON != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" >/dev/null && echo "Mise en ligne demandée."; else echo "Pas de VERCEL_DEPLOY_HOOK : la mise en ligne dépend du push."; fi
      - name: Garder l'état pour le prochain passage
        if: env.JETON != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view annuaire-etat >/dev/null 2>&1 || gh release create annuaire-etat --prerelease --title "État de l'annuaire" --notes "Fichier technique : état de la recherche GitHub entre deux passages."
          gh release upload annuaire-etat data/raw/etat.json --clobber
      - name: Signaler l'échec
        if: failure() && env.JETON != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Annuaire : la mise à jour a échoué le $(date +%F)" --body "Voir le journal : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Rien n'a été publié, la liste en ligne est inchangée."
